apiVersion: apps/v1
kind: Deployment
metadata:
  name: siniestros-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siniestros-ml
  template:
    metadata:
      labels:
        app: siniestros-ml
    spec:
      containers:
        - name: siniestros-ml
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: siniestros-ml-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10