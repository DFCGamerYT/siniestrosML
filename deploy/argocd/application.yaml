apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: siniestros-ml
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/DFCGamerYT/siniestrosML.git'
    targetRevision: main
    path: 'siniestros-ml-chart'
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: siniestros-ml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
